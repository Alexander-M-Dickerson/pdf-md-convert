name: Build and test (no publishing)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12', '3.14']
        include:
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest build twine
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
      - run: python -m build
      - run: python tools/check_dist.py
      - run: python tools/check_wheel.py --work-dir .local/wheel-check
