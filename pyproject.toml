[project]
name = "pdf-md-convert"
dynamic = ["version"]
description = "Local academic PDF-to-Markdown conversion with auditable AI-assisted review"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["pymupdf>=1.27.2,<1.28", "ftfy>=6.3,<7"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Topic :: Text Processing"]

[project.optional-dependencies]
layout = ["pymupdf4llm>=1.27.2,<1.28"]
ocr = ["marker-pdf>=1.10.2,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
release = ["build>=1.2,<2", "twine>=6,<7", "hatchling>=1.27,<2"]

[project.scripts]
pdf-md-convert = "pdf_md_convert.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pdf_md_convert/__init__.py"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/pdf_md_convert"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/docs", "/examples", "/.agents", "/.github", "/README.md", "/AGENTS.md", "/LICENSE", "/NOTICE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/pyproject.toml", "/uv.lock", "/.gitignore", "/tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
